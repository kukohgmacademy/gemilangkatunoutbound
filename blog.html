<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog & Artikel Outbound Malang Batu | GemilangKatunOutbond</title>
  <link rel="icon" type="image/png" href="/assets/images/logoo.webp" />
  
  <meta name="description" content="Kumpulan artikel, tips, dan panduan wisata outbound Malang Batu dari GemilangKatunOutbond. Rekomendasi lokasi, harga, dan ide team building." />
  <meta name="keywords" content="gemilangkatunoutbond, blog outbound malang, tips team building malang, panduan wisata batu malang" />
  <link rel="canonical" href="https://gemilangkatunoutbond.co.id/blog.html" />

  <link rel="stylesheet" href="/src/index.css" />
</head>
<body class="bg-[#0B132B] text-[#E2E8F0] antialiased selection:bg-[#2563EB] selection:text-white font-sans">

  <!-- Mount Navbar -->
  <div id="navbar-mount"></div>

  <!-- HEADER BANNER -->
  <section class="py-16 bg-[#0B132B] border-b border-[#1E2F4D] text-white text-center relative reveal">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-3">
      <span class="inline-block px-3.5 py-1 rounded-full bg-[#2563EB]/20 border border-[#2563EB]/40 text-[#38BDF8] text-xs font-bold uppercase tracking-widest">
        Portal Informasi GemilangKatunOutbond
      </span>
      <h1 class="text-3xl sm:text-4xl font-serif font-bold text-white italic">Artikel & Blog Outbound Malang Batu</h1>
      <p class="text-xs sm:text-sm text-[#94A3B8] max-w-2xl mx-auto font-light leading-relaxed">
        Dapatkan tips berharga seputar persiapan outbound kantor, pemilihan lokasi wisata di Batu, dan inspirasi permainan team building.
      </p>
    </div>
  </section>

  <!-- BLOG LIST GRID -->
  <section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 reveal">
    <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Injected via JS -->
    </div>
  </section>

  <!-- Mount Footer -->
  <div id="footer-mount"></div>

  <script type="module">
    import { renderNavbar, renderFooter, renderFloatingWA, initScrollReveal } from '/src/js/shared.js';
    import { blogsData } from '/src/data/blogs.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('blog');
      renderFooter();
      renderFloatingWA();

      const grid = document.getElementById('blog-grid');
      if (grid) {
        grid.innerHTML = blogsData.map(blog => `
          <article class="rounded-2xl bg-[#131F37] border border-[#1E2F4D] shadow-sm overflow-hidden flex flex-col justify-between group hover:border-[#2563EB] transition-all duration-300 reveal">
            <div>
              <div class="relative h-48 overflow-hidden">
                <img src="${blog.image}" alt="${blog.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-[#2563EB] text-white text-[10px] font-bold border border-[#1E2F4D] backdrop-blur-sm">
                  ${blog.category}
                </span>
              </div>
              
              <div class="p-5 space-y-2.5">
                <div class="text-[10px] text-[#94A3B8] flex items-center space-x-3">
                  <span class="flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5 text-[#38BDF8]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    <span>${blog.date}</span>
                  </span>
                  <span>•</span>
                  <span class="flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5 text-[#38BDF8]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    <span>${blog.author}</span>
                  </span>
                </div>
                <h2 class="text-base font-bold text-white group-hover:text-[#38BDF8] transition-colors leading-snug">${blog.title}</h2>
                <p class="text-xs text-[#94A3B8] line-clamp-3 leading-relaxed font-light">${blog.excerpt}</p>
              </div>
            </div>

            <div class="p-5 pt-0">
              <a href="/blog/${blog.id}.html" class="py-2.5 rounded-full bg-[#2563EB] hover:bg-[#1D4ED8] text-white text-center text-xs font-bold block transition-all shadow-sm">
                Selengkapnya
              </a>
            </div>
          </article>
        `).join('');
      }

      initScrollReveal();
    });
  </script>
</body>
</html>
